services:
  teamspeak:
    image: teamspeak
    restart: unless-stopped
    environment:
      TS3SERVER_LICENSE: accept
    ports:
      - "9987:9987/udp"
      - "10011:10011"
      - "30033:30033"
    volumes:
      - teamspeak-data:/var/ts3server:U
      - ./teamspeak/query_ip_allowlist.txt:/var/ts3server/query_ip_allowlist.txt:Z

  bot:
    image: ghcr.io/miguelmoraesp/ts-discord-monitor:latest
    restart: unless-stopped
    depends_on:
      - teamspeak
    env_file:
      - .env
    volumes:
      - ./data:/app/data

volumes:
  teamspeak-data:
